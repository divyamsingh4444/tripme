<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Purpose-built favicon. The full TripMe lockup (script wordmark + hairline
    plane outline) turns to mush below ~48px, so the tab icon reduces the brand
    to its two most recognisable parts — the Pine field and the marigold flight
    path — with a solid plane that still reads at 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#14453D"/>
  <path d="M12 48 C25 48 35 41 42 28" stroke="#FFB52E" stroke-width="4" stroke-linecap="round"
        fill="none" stroke-dasharray="0.1 8"/>
  <circle cx="12" cy="48" r="4" fill="#FFB52E"/>
  <path d="M33 34 L52 13 L47 33.5 L36 45 L34.5 36.5 L26 35.5 Z" fill="#FFFFFF"/>
</svg>
